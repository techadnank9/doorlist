# Render setup: Postgres, the API server, Explore's hourly collector, and the landing page.
# New > Blueprint > pick this repo. Then paste the three API keys into
# doorlist-server > Environment (they're left blank on purpose).
databases:
  - name: doorlist-db
    plan: basic-256mb
    region: oregon
    databaseName: doorlist
    user: doorlist

services:
  - type: web
    name: doorlist-server
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: doorlist-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APPLE_BUNDLE_ID
        value: com.doorlist.app
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Explore's collector: reads Luma and the other event sites once an hour, politely, into the
  # same database the server reads. Phones never reach those sites through Doorlist.
  - type: cron
    name: doorlist-collector
    runtime: python
    plan: starter
    region: oregon
    schedule: "7 * * * *"
    rootDir: collector
    buildCommand: pip install -r requirements.txt
    startCommand: python -m doorlist_collector.run
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: doorlist-db
          property: connectionString

  - type: web
    name: doorlist-site
    runtime: static
    buildCommand: echo "static"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
