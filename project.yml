name: Doorlist
options:
  bundleIdPrefix: com.doorlist
  deploymentTarget:
    iOS: "17.0"
  autogenerateSchemes: true
# Declared here, not in Xcode: Doorlist.xcodeproj is regenerated from this file, so a package
# added through Xcode or a setup wizard would vanish on the next `xcodegen generate`.
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.90.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.29.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: S2UTA2J3GD
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Doorlist's server on Render, for every build. For a local `npm run dev:mock`, use http://localhost:8787.
    DOORLIST_API_BASE: https://doorlist-server.onrender.com
    DOORLIST_APP_TOKEN: change-me
    # Product analytics and crash reports. Empty means off; set them for Release builds.
    POSTHOG_API_KEY: phc_uBjZjjsEG6ZNMTokNWuPvpW3FbAX4aBsmfFn9X47TStT
    POSTHOG_HOST: https://us.i.posthog.com
    SENTRY_DSN: https://972bf8a3b08af8da511e0cd314cad6ba@o4512283405189120.ingest.us.sentry.io/4512284217245696
targets:
  Doorlist:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doorlist
        # The version settings above; without these XcodeGen writes a fixed 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Canvas
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsWriteOnlyAccessUsageDescription: Doorlist adds events you book to your calendar when you ask it to.
        NSCalendarsFullAccessUsageDescription: Doorlist checks when you're busy so Find skips events that clash. Your calendar never leaves your phone.
        NSLocationWhenInUseUsageDescription: Doorlist finds events near you. Only your town is used in a search, never your exact spot.
        NSMicrophoneUsageDescription: Speak your answers instead of typing them.
        NSSpeechRecognitionUsageDescription: Turns your spoken answers into text when Doorlist's server can't.
        DoorlistAPIBase: $(DOORLIST_API_BASE)
        DoorlistAppToken: $(DOORLIST_APP_TOKEN)
        PostHogAPIKey: $(POSTHOG_API_KEY)
        PostHogHost: $(POSTHOG_HOST)
        SentryDSN: $(SENTRY_DSN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Doorlist.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doorlist.app
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorlist.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DoorlistShare
      - package: PostHog
      - package: Sentry
  DoorlistShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Doorlist
        # The version settings above; without these XcodeGen writes a fixed 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
        NSMicrophoneUsageDescription: Speak your answers instead of typing them.
        NSSpeechRecognitionUsageDescription: Turns your spoken answers into text when Doorlist's server can't.
        DoorlistAPIBase: $(DOORLIST_API_BASE)
        DoorlistAppToken: $(DOORLIST_APP_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: ShareExtension/DoorlistShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doorlist.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doorlist.app.share
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
